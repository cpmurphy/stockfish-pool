plugins: rubocop-minitest

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.0
  Exclude:
    - 'bin/**/*'
    - 'vendor/**/*'
    - 'Stockfish/**/*'

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: single_quotes

Style/FrozenStringLiteralComment:
  Enabled: true

Metrics/ClassLength:
  Max: 150
  Exclude:
    - 'test/**/*'
    - 'client/test/**/*'

Metrics/ModuleLength:
  Max: 120
  Exclude:
    - 'test/**/*'
    - 'client/test/**/*'

Metrics/MethodLength:
  Max: 26
  Exclude:
    - 'test/**/*'
    - 'client/test/**/*'

Metrics/AbcSize:
  Max: 25
  Exclude:
    - 'test/**/*'
    - 'client/test/**/*'

Metrics/BlockLength:
  Max: 30
  Exclude:
    - 'test/**/*'
    - 'client/test/**/*'

Layout/LineLength:
  Max: 120
  Exclude:
    - 'test/**/*'
    - 'client/test/**/*'

Naming/VariableNumber:
  EnforcedStyle: snake_case

Style/NumericLiterals:
  Enabled: false

Style/ClassAndModuleChildren:
  Enabled: false

Naming/MethodParameterName:
  AllowedNames: ['id', 'ip', 'to', 'x', 'y', 'pv']

# Pool tests assert several facts per example.
Minitest/MultipleAssertions:
  Exclude:
    - 'test/**/*'
    - 'client/test/**/*'
